  syntax = "proto3";
  option go_package = "erp-2c/v1/notify-grpc";


  message DeliveryStatus {
    string status = 1;
  }

  message Notification {
    int64 DeliveryId = 1;
    DeliveryStatus Status = 2;
    int64 CreatedAt = 3;
    int64 UserID = 4;
  }

  message EmptyResponse {}
  service NotifyService {
     rpc   SendNotify(Notification) returns (EmptyResponse);
  }




